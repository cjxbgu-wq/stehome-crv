name: Build Vdcampro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 ldid
        run: brew install ldid || true

      - name: 安装 Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: 构建 deb (Rootless 无根包)
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
        env:
          THEOS: ${{ env.THEOS }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Vdcampro-deb-rootless
          path: packages/*.deb
          if-no-files-found: error
